# DIFFUSIO — site Nginx
# Installation : voir l'etape 9 du guide. Remplacez <VOTRE_DOMAINE>.
# Certbot ajoutera lui-meme la partie HTTPS (port 443) a ce fichier.

server {
    listen 80;
    listen [::]:80;
    server_name <VOTRE_DOMAINE>;

    # Les livrables peuvent peser 20 Mo : marge pour le reste du formulaire.
    client_max_body_size 25m;

    # La generation des rapports PDF peut prendre quelques secondes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Fichiers statiques de l'application : mis en cache longtemps.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
